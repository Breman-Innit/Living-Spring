<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Living Spring School</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap">
<style>
:root{--bg:#fff;--fg:#0f1a14;--muted:#f4f7f5;--mfg:#5f6b64;--border:#e2e8e4;--primary:#1f7a45;--primary-fg:#fff;--primary-soft:#e8f3ec;--ease:cubic-bezier(.21,.47,.32,.98);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--fg:#eef3f0;--muted:#16201a;--mfg:#9aa8a0;--border:#243029;--primary:#3fae6b;--primary-fg:#08130c;--primary-soft:#163223}}
:root[data-theme="dark"]{--bg:#0e1511;--fg:#eef3f0;--muted:#16201a;--mfg:#9aa8a0;--border:#243029;--primary:#3fae6b;--primary-fg:#08130c;--primary-soft:#163223}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:15px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;letter-spacing:-.02em;line-height:1.15}
h1{font-size:clamp(30px,4vw,36px)}h2{font-size:20px}
a{color:inherit}button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;gap:12px;padding:0 20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.brand{font:600 19px "Source Serif 4",serif;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--primary)}
.sp{flex:1}
.btn{height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-weight:500;transition:background .25s var(--ease),transform .25s var(--ease)}
.btn:hover{background:var(--muted)}
.btn.p{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}.btn.p:hover{opacity:.9;background:var(--primary)}
.btn.g{border-color:transparent}
#menu{display:none}
.shell{display:flex;max-width:1280px;margin:0 auto}
nav{width:248px;flex:none;border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
nav a{display:block;padding:8px 12px;border-radius:6px;text-decoration:none;color:var(--mfg);font-size:14px;transition:background .25s var(--ease)}
nav a:hover{background:var(--muted);color:var(--fg)}
nav a[aria-current=page]{background:var(--primary-soft);color:var(--primary);font-weight:600}
main{flex:1;min-width:0;padding:40px 20px 64px;max-width:1000px}
.lead{color:var(--mfg);max-width:60ch;margin-top:8px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:32px 0 16px}
.search{flex:1;min-width:200px;height:44px;border:1px solid var(--border);border-radius:6px;padding:0 14px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--border);border-radius:999px;padding:4px 14px;background:var(--bg);cursor:pointer;font-size:13px}
.chip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;font-weight:500;color:var(--mfg);font-size:13px;padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--muted)}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.tag.m{background:var(--muted);color:var(--mfg)}
.empty{border:1px dashed var(--border);border-radius:6px;padding:40px 20px;text-align:center;color:var(--mfg)}
.empty button{margin-top:8px;background:none;border:0;color:var(--primary);text-decoration:underline;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px;margin:32px 0 48px;padding:24px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.stats b{display:block;font:600 32px "Source Serif 4",serif;letter-spacing:-.02em}.stats span{color:var(--mfg);font-size:13px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sh a{font-size:13px;color:var(--mfg)}
.row{display:flex;gap:12px;align-items:center;padding:12px;border-radius:6px;text-decoration:none;transition:background .25s var(--ease)}
.row:hover{background:var(--muted)}.row:hover .ar{transform:translateX(4px)}
.av{width:36px;height:36px;border-radius:50%;background:var(--muted);display:grid;place-items:center;font-weight:600;color:var(--primary);flex:none}
.row small{display:block;color:var(--mfg)}.row div:nth-child(2){flex:1;min-width:0}
.ar{transition:transform .25s var(--ease);color:var(--mfg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 24px}
.sec{margin-top:48px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease);z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}
main>*{animation:in .5s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@media(max-width:860px){
#menu{display:inline-block}
nav{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:0;bottom:0;background:var(--bg);z-index:25;height:auto;transform:translateX(-100%);transition:transform .3s var(--ease);width:min(300px,86vw)}
nav.open{transform:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#theme{width:40px;padding:0;display:grid;place-items:center}#theme svg{width:19px;height:19px;display:block}
button.av{border:0;cursor:pointer}
dialog{width:min(480px,calc(100vw - 32px));max-height:calc(100vh - 32px);margin:auto;padding:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg)}
dialog::backdrop{background:#0b1510a8}
.mh{display:flex;justify-content:space-between;gap:16px;margin-bottom:20px}.mh p{color:var(--mfg);font-size:14px;margin-top:4px}
.ib{width:36px;height:36px;border:1px solid var(--border);border-radius:6px;background:var(--bg);cursor:pointer;font-size:20px}
.ff{display:grid;gap:14px}.ff label{display:grid;gap:6px;color:var(--mfg);font-size:13px;font-weight:500}
.ff input,.ff select,.lf input[type=text]{width:100%;height:44px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg)}
.fa{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.toast.act{pointer-events:auto}.toast button{margin-left:14px;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer}
.lnk{background:none;border:0;color:var(--primary);cursor:pointer;padding:4px 8px;border-radius:6px}.lnk:hover{background:var(--primary-soft)}
td.act{white-space:nowrap;text-align:right}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}#login[hidden]{display:none}
.lf{width:min(420px,100%);display:grid;gap:20px}.lf p{color:var(--mfg)}
.roles{display:grid;gap:8px;border:0;padding:0}.roles legend{font-size:13px;font-weight:500;color:var(--mfg);margin-bottom:8px}
.roles label{display:flex;gap:12px;align-items:center;border:1px solid var(--border);border-radius:6px;padding:12px 14px;cursor:pointer}
.roles label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}.roles small{display:block;color:var(--mfg)}
.roles input{accent-color:var(--primary)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-bottom:48px}
.chart{border:1px solid var(--border);border-radius:6px;padding:20px}.chart h3{font-size:17px;margin-bottom:4px}.chart>p{color:var(--mfg);font-size:13px;margin-bottom:16px}
.chart svg{width:100%;height:auto;display:block}.chart text{fill:var(--mfg);font-size:11px;font-family:Inter,sans-serif}
.hb{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;margin:10px 0;font-size:13px}.hb i{display:block;height:10px;border-radius:3px;background:var(--primary)}.hb b{font-weight:500;text-align:right}
.seg{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:2px;margin:18px 0 14px}.seg i{display:block}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mfg)}.lg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:6px}
</style>
</head>
<body>
<header class="top">
<button class="btn g" id="menu" aria-label="Open menu" aria-expanded="false">Menu</button>
<a class="brand" href="#dashboard"><span class="dot"></span>Living Spring</a>
<span class="sp"></span>
<button class="btn g" id="theme" type="button"></button>
<button class="av" id="who" type="button" aria-label="Signed-in user"></button><button class="btn g" id="signout" type="button">Sign out</button>
</header>
<div class="shell">
<nav id="nav" aria-label="Main"></nav>
<main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="dlg" aria-labelledby="rt"><form id="rf"><div class="mh"><div><h2 id="rt"></h2><p id="rd"></p></div><button class="ib" type="button" id="x" aria-label="Close">×</button></div><div class="ff" id="ff"></div><div class="fa"><button class="btn" type="button" id="cx">Cancel</button><button class="btn p" type="submit">Save record</button></div></form></dialog>
<div id="login"><form class="lf" id="lf"><div><a class="brand" href="#" style="margin-bottom:20px"><span class="dot"></span>Living Spring</a><h1>Sign in</h1><p style="margin-top:8px">Choose your role to see the areas you can use. This demo does not check passwords.</p></div>
<label class="ff" style="gap:6px"><span style="color:var(--mfg);font-size:13px;font-weight:500">Your name</span><input type="text" name="name" placeholder="e.g. Grace Mensah" autocomplete="name" required></label>
<fieldset class="roles"><legend>Role</legend>
<label><input type="radio" name="role" value="Administrator" checked><span>Administrator<small>Full access to every area, can add, edit and delete</small></span></label>
<label><input type="radio" name="role" value="Instructor"><span>Instructor<small>Teaching areas, can add, edit and delete</small></span></label>
<label><input type="radio" name="role" value="Student"><span>Student<small>Own learning areas, view only</small></span></label></fieldset>
<button class="btn p" type="submit" style="height:44px">Sign in</button></form></div>

<script>

const M=[
["dashboard","Dashboard","A clear view of today across classes, people and payments."],

];
const $=s=>document.querySelector(s),main=$("#main"),nav=$("#nav"),dlg=$("#dlg"),KEY="ls-records-v2",SES="ls-session-v1";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ACC={Administrator:null,Instructor:["dashboard","students","courses","content","assignments","exams","grading","attendance","progress","messages","forums","classroom","calendar"],Student:["dashboard","courses","content","assignments","exams","grading","progress","messages","forums","classroom","certificates","payments","calendar"]};
let user=null,ed=null;
try{const sv=JSON.parse(localStorage.getItem(KEY)||"{}");M.forEach(m=>{if(Array.isArray(sv[m[0]]))m[5]=sv[m[0]]})}catch{}
try{user=JSON.parse(localStorage.getItem(SES)||"null")}catch{}

main.innerHTML=`<h1>Good morning, ${esc(user.name.split(/\s+/)[0])}</h1><p class="lead">Signed in as ${user.role.toLowerCase()}. Here is what is happening at Living Spring today.</p>

function view(m){

main.innerHTML=`<h1>${m[1]}</h1><p class="lead">${m[2]}${ed_?"":" You have view-only access."}</p>
<div class="bar"><input class="search" id="q" type="search" placeholder="Search ${m[1].toLowerCase()}" aria-label="Search">${ed_?`<button class="btn p" id="add">${m[3]}</button>`:""}</div>

const out=$("#out");
function draw(){const r=m[5].map((x,i)=>[x,i]).filter(([x])=>(st=="All"||x[x.length-1]==st)&&x.join(" ").toLowerCase().includes(q));
out.innerHTML=r.length?`<div class="tw"><table><thead><tr>${m[4].map(c=>`<th scope="col">${c}</th>`).join("")}${ed_?'<th scope="col" style="text-align:right">Actions</th>':""}</tr></thead><tbody>${r.map(([x,i])=>`<tr>${x.map((c,k)=>k==x.length-1?`<td>${tag(c)}</td>`:`<td${k?' style="color:var(--mfg)"':' style="font-weight:500"'}>${esc(c)}</td>`).join("")}${ed_?`<td class="act"><button class="lnk" data-e="${i}" aria-label="Edit ${esc(x[0])}">Edit</button><button class="lnk" data-d="${i}" aria-label="Delete ${esc(x[0])}">Delete</button></td>`:""}</tr>`).join("")}</tbody></table></div>`:`<div class="empty">${m[5].length?"Nothing matches your search.":"No records yet."}<br><button id="clr">${m[5].length?"Clear filters":m[3]}</button></div>`;
const c=$("#clr");if(c)c.onclick=()=>{if(!m[5].length)return ed_&&openForm(m);q="";st="All";$("#q").value="";sync();draw()}}
const sync=()=>document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.textContent==st));
$("#q").oninput=e=>{q=e.target.value.toLowerCase();draw()};
$("#chips").onclick=e=>{if(e.target.classList.contains("chip")){st=e.target.textContent;sync();draw()}};
out.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.e!=null)openForm(m,+b.dataset.e);if(b.dataset.d!=null){const i=+b.dataset.d,row=m[5].splice(i,1)[0];save();refresh(m);toast("Record deleted","Undo",()=>{m[5].splice(i,0,row);save();refresh(m)})}};
if(ed_)$("#add").onclick=()=>openForm(m);draw()}
function openForm(m,i){ed={m,i};const row=i==null?[]:m[5][i],sts=[...new Set(m[5].map(r=>r[r.length-1]))];
$("#rt").textContent=i==null?m[3]:"Edit record";$("#rd").textContent=(i==null?"Add a record to ":"Update this record in ")+m[1].toLowerCase()+".";
$("#ff").innerHTML=m[4].map((l,k)=>`<label>${l}${k==m[4].length-1&&sts.length?`<select name="f${k}" required>${sts.map(s=>`<option${s==row[k]?" selected":""}>${esc(s)}</option>`).join("")}</select>`:`<input name="f${k}" value="${esc(row[k]??"")}" autocomplete="off" required>`}</label>`).join("");
dlg.showModal();$("#ff input").focus()}
$("#rf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),{m,i}=ed,row=m[4].map((_,k)=>String(f.get("f"+k)||"").trim());if(row.some(v=>!v))return;i==null?m[5].unshift(row):m[5][i]=row;save();dlg.close();refresh(m);toast(i==null?"Record added":"Changes saved")};
$("#x").onclick=$("#cx").onclick=()=>dlg.close();
function route(){if(!user)return;let m=byId(location.hash.slice(1)||"dashboard")||M[0];if(!allowed(m)){m=M[0];toast("Your role can't open that area")}
nav.querySelectorAll("a").forEach(a=>a.dataset.id==m[0]?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
m[0]=="dashboard"?dash():view(m);document.title=m[1]+" · Living Spring";nav.classList.remove("open");$("#menu").setAttribute("aria-expanded","false");scrollTo(0,0)}
function showApp(){$("#login").hidden=!!user;if(!user)return;$("#who").textContent=user.name.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();$("#who").title=user.name+" · "+user.role;$("#who").setAttribute("aria-label","Signed in as "+user.name+", "+user.role);nav.innerHTML=M.filter(allowed).map(m=>`<a href="#${m[0]}" data-id="${m[0]}">${m[1]}</a>`).join("");route()}
$("#lf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);user={name:String(f.get("name")).trim(),role:f.get("role")};try{localStorage.setItem(SES,JSON.stringify(user))}catch{}showApp()};
$("#signout").onclick=()=>{user=null;try{localStorage.removeItem(SES)}catch{}location.hash="";$("#lf").reset();showApp()};
addEventListener("hashchange",route);showApp();
$("#menu").onclick=()=>{const o=nav.classList.toggle("open");$("#menu").setAttribute("aria-expanded",o)};
const tb=$("#theme"),sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>',moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>';
function th(){const d=document.documentElement.dataset.theme=="dark",l=d?"Switch to light mode":"Switch to dark mode";tb.innerHTML=d?sun:moon;tb.setAttribute("aria-label",l);tb.title=l}
th();tb.onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=="dark"?"light":"dark";th()};
</script>
</body>
</html>
